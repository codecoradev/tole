[package]
name = "tole-desktop"
description = "Native desktop client for tole (a thin client of a local `tole serve`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the desktop ships as an application, not as a library.
publish = false

# The one tole crate this crate depends on is the typed client `tole-client`
# (#1040), the thin client of `tole serve`: never `tole-core`, `tole-tui` or
# `tole-cli` (the session host). `tole-core` is in the closure only through
# `tole-client` (its wire types). `scripts/desktop-check.sh deps` checks the
# resolved dependency graph (cargo metadata), so renames, target tables and
# spelling do not matter.
#
# The GUI toolkit is behind the `gpui` feature, off by default, so
# `cargo test --workspace` never builds it. Every pin is exact (`=`),
# optional and from crates.io, and only `src/ui/adapter.rs` names these crates,
# so an upgrade changes this block and that file. `gpui-component` 0.9.1
# depends on `gpui-pre =0.3.12`, a crates.io snapshot of Zed's GPUI whose
# library is named `gpui`; the `gpui` and `gpui_platform` pins below must stay
# equal to that version.

# Crate kind of the CodeCora modular + thin-UI standard (#1250); checked by
# scripts/arch-check.sh. See "Crate kinds" in docs/architecture.md.
[package.metadata.tole]
kind = "bin"

[lints]
workspace = true

[features]
default = []
gpui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component"]
# The offscreen render harness (`src/ui/harness.rs`, `examples/render.rs`,
# `tests/render.rs`). It needs the `test-support` feature of `gpui` and
# `gpui_platform`, which this manifest never enables, so it does not build from
# here: `scripts/desktop-render.sh` enables it in a temporary copy of this
# manifest and runs it there. Nothing in the committed dependency graph or in
# `Cargo.lock` changes, and no CI job turns this feature on.
render-harness = ["gpui"]

[dependencies]
tole-desktop-model = { version = "0.12.0", path = "../tole-desktop-model" }
tole-client = { path = "../tole-client" }
# The client keeps the JSON of a frame it could not decode (`Event::Other`), of the
# fields it does not model (`Approval::extra`) and of an entry (`Entry::payload`)
# as `serde_json::Value`; the adapter reads them. Already a dependency of
# tole-client at the same requirement: no new package.
serde_json = { workspace = true }
gpui = { package = "gpui-pre", version = "=0.3.12", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", optional = true, features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { version = "=0.10.0", optional = true }

# The local serve supervisor (macOS, Linux) needs flock, kill and the peer
# credentials of a socket, which std does not expose. Already a dependency of
# tole-core, tole-cli and tole-client at this version: no new package.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "tole_desktop"
path = "src/lib.rs"

[[bin]]
name = "tole-desktop"
path = "src/main.rs"

# Both need `render-harness` (see above), so a plain `cargo test` or
# `cargo clippy --all-targets` skips them.
[[example]]
name = "render"
path = "examples/render.rs"
required-features = ["render-harness"]

[[test]]
name = "render"
path = "tests/render.rs"
required-features = ["render-harness"]

[[test]]
name = "render_task"
path = "tests/render_task.rs"
required-features = ["render-harness"]
