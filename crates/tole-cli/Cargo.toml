[package]
name = "tole-cli"
description = "Headless CLI host for tole-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tole"
path = "src/main.rs"

[features]
# Mirrors tole-core's shell-tools gate so cfg in this crate resolves.
# The CLI always wants the shell tools; embedders use tole-core directly.
default = ["shell-tools"]
shell-tools = ["tole-core/shell-tools"]

[dependencies]
tole-core = { path = "../tole-core" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = "0.2"
