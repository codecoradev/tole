[package]
name = "tole-cli"
description = "Headless CLI host for tole-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tole_cli"
path = "src/lib.rs"

[[bin]]
name = "tole"
path = "src/main.rs"

[features]
# Mirrors tole-core's gates so cfg in this crate resolves. The CLI
# always wants the shell tools, the MCP client (the auto-preset needs
# it), and the HTTP daemon surface (`tole serve --transport mcp`) — a
# crates.io install must expose every documented face (#163 follow-up,
# 2026-10-05); embedders use tole-core directly with their own feature
# choices and are unaffected by this crate's defaults.
default = ["shell-tools", "mcp", "mcp-http"]
shell-tools = ["tole-core/shell-tools"]
mcp = ["tole-core/mcp"]
# MCP-over-HTTP host (#137): rmcp streamable-http server + hyper serving.
mcp-http = ["mcp", "shell-tools", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tower-service", "dep:rmcp", "dep:http", "tole-core/mcp-http"]
# Offline trace replay scorer (issue #107/#118): eval-only bin, NOT in
# the default build. `cargo install tole-cli` and plain `cargo build`
# never produce it; eval sessions opt in explicitly:
#   cargo build -p tole-cli --features replay --bin tole-replay
replay = []

[dependencies]
tole-core = { version = "0.8.1", path = "../tole-core" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
# `.tole/config.toml` loader (#208). Parse-only: no encoder needed beyond
# `display` (value rendering in `tole config check`). tole-core stays free of it.
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
clap = { workspace = true }
libc = "0.2"
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }
http-body-util = { version = "0.1", optional = true }
tower-service = { version = "0.3", optional = true }
rmcp = { version = "3.3", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
http = { version = "1", optional = true }

# Offline trace replay scorer (issue #107, gated behind the `replay`
# feature since #118). Lives under evals/ and is operator-built for
# eval use — it is NOT part of the shipped tole binary and NOT built
# by default; see the `replay` feature above.
[[bin]]
name = "tole-replay"
path = "../../evals/replay/replay.rs"
required-features = ["replay"]
