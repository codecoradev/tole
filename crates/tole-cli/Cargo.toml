[package]
name = "tole-cli"
description = "Headless CLI host for tole-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tole_cli"
path = "src/lib.rs"

[[bin]]
name = "tole"
path = "src/main.rs"

[features]
# Mirrors tole-core's gates so cfg in this crate resolves. The CLI
# always wants the shell tools and the MCP client (the auto-preset needs
# it); embedders use tole-core directly with their own feature choices.
default = ["shell-tools", "mcp"]
shell-tools = ["tole-core/shell-tools"]
mcp = ["tole-core/mcp"]
# Offline trace replay scorer (issue #107/#118): eval-only bin, NOT in
# the default build. `cargo install tole-cli` and plain `cargo build`
# never produce it; eval sessions opt in explicitly:
#   cargo build -p tole-cli --features replay --bin tole-replay
replay = []

[dependencies]
tole-core = { version = "0.3.0", path = "../tole-core" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = "0.2"

# Offline trace replay scorer (issue #107, gated behind the `replay`
# feature since #118). Lives under evals/ and is operator-built for
# eval use — it is NOT part of the shipped tole binary and NOT built
# by default; see the `replay` feature above.
[[bin]]
name = "tole-replay"
path = "../../evals/replay/replay.rs"
required-features = ["replay"]
