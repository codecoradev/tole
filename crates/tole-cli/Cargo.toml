[package]
name = "tole-cli"
description = "Headless CLI host for tole-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# std `File::lock` (the cron job-store lock, #579) is stable since 1.89.
rust-version = "1.89"

[lib]
name = "tole_cli"
path = "src/lib.rs"

[[bin]]
name = "tole"
path = "src/main.rs"

[features]
# Mirrors tole-core's gates so cfg in this crate resolves. The CLI
# always wants the shell tools, the MCP client (the auto-preset needs
# it), and the HTTP daemon surface (`tole serve --transport mcp`) — a
# crates.io install must expose every documented face (#163 follow-up,
# 2026-10-05); embedders use tole-core directly with their own feature
# choices and are unaffected by this crate's defaults.
default = ["shell-tools", "mcp", "mcp-http", "tui", "web-builtin"]
shell-tools = ["tole-core/shell-tools"]
# Interactive terminal UI (#459): bare `tole` on a TTY. Off = plain help as before.
tui = ["dep:tole-tui"]
mcp = ["tole-core/mcp"]
# MCP-over-HTTP host (#137): rmcp streamable-http server + hyper serving.
mcp-http = ["mcp", "shell-tools", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tower-service", "dep:rmcp", "dep:http", "tole-core/mcp-http"]
# Built-in web search and fetch (#625) over nginjen-lite: keyless engines,
# robots.txt and HTML converters. Off = today's tools: the direct text
# fetcher, and search only with a configured backend.
web-builtin = ["dep:nginjen-lite", "dep:url"]
# Offline trace replay scorer (issue #107/#118): eval-only bin, NOT in
# the default build. `cargo install tole-cli` and plain `cargo build`
# never produce it; eval sessions opt in explicitly:
#   cargo build -p tole-cli --features replay --bin tole-replay
replay = []

[dependencies]
tole-core = { version = "0.11.0", path = "../tole-core" }
tole-tui = { version = "0.11.0", path = "../tole-tui", optional = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
# `.tole/config.toml` loader (#208). Parse-only: no encoder needed beyond
# `display` (value rendering in `tole config check`). tole-core stays free of it.
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
clap = { workspace = true }
libc = "0.2"
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }
http-body-util = { version = "0.1", optional = true }
tower-service = { version = "0.3", optional = true }
rmcp = { version = "3.3", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
http = { version = "1", optional = true }
# Webhook `regex` filters (#582 part 2): no dependencies, and matching is
# linear in pattern and input (no backtracking); patterns and inputs are
# capped in `hook_filter`. Serve side only: tole-core does not use it.
regex-lite = "0.1"
# Built-in web search and fetch (#625, the `web-builtin` feature): keyless
# engines and HTML converters, no async runtime and no HTTP stack of its own
# (tole's ureq client is plugged in through its `HttpClient` trait). `robots`
# adds robots.txt support at no crate cost; `pdf`, `readability` and `ureq`
# stay off.
nginjen-lite = { version = "0.1.0", features = ["robots"], optional = true }
# Already in the tree through nginjen-lite; named for its link resolver.
url = { version = "2", optional = true }

# Offline trace replay scorer (issue #107, gated behind the `replay`
# feature since #118). Lives under evals/ and is operator-built for
# eval use — it is NOT part of the shipped tole binary and NOT built
# by default; see the `replay` feature above.
[[bin]]
name = "tole-replay"
path = "../../evals/replay/replay.rs"
required-features = ["replay"]

# Mirror of the workspace-root [profile.release]. Cargo ignores this for
# workspace builds, but the root profile is not packaged, so `cargo install
# tole-cli` only gets the size-focused profile from here. Keep both in sync;
# no panic = "abort" (see the root Cargo.toml).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
