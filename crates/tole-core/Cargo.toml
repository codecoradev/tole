[package]
name = "tole-core"
description = "Durable agent harness core: session state machine, JSONL storage, tools, approval policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# CLI-backed tools that spawn subprocesses (run_command, git, gh, cora,
# uteke). Default-on for the CLI host; embedders on platforms without a
# shell (Android/iOS via flutter_rust_bridge) build with
# --no-default-features and register their own tool set.
default = ["shell-tools"]
shell-tools = []
# MCP client (issue #74): register external MCP servers' tools into the
# registry over stdio. Mobile/embedder profiles stay MCP-free.
mcp = ["dep:rmcp", "dep:tokio", "dep:rustls", "dep:url", "shell-tools"]
# rmcp streamable-http-server pulls tower/http types for the HTTP transport.
mcp-http = ["mcp", "rmcp/transport-streamable-http-server"]

[dependencies]
# transport-streamable-http-client-reqwest: the HTTP(S) MCP client transport (#530).
# reqwest-tls-no-provider: rustls without a bundled crypto provider, so the
# `ring` provider ureq already pulls in is the only one (no aws-lc).
rmcp = { version = "3.9", features = ["client", "server", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"], optional = true }
# reqwest-tls-no-provider needs a process-level crypto provider before it
# builds a client: install `ring` (already in the tree via ureq), see mcp.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# The url crate is the parser reqwest uses: validate_http_url runs it so a url that passes
# validation can never be one the client later refuses (or panics on).
url = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time"], optional = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = "0.23"
# SKILL.md content hashes for the skill index (#590); already in the tree via rmcp.
sha2 = "0.11"
ureq = { workspace = true }

[[test]]
name = "mcp_tests"
required-features = ["mcp"]

[[test]]
name = "mcp_prompts"
required-features = ["mcp"]

[[test]]
name = "mcp_admission"
required-features = ["mcp"]

[[test]]
name = "mcp_http"
required-features = ["mcp"]
