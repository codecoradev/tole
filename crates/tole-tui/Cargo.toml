[package]
name = "tole-tui"
description = "Inline terminal UI for tole (presentation + event loop over tole-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tole-core = { version = "0.10.1", path = "../tole-core", default-features = false }
# Inline viewport only: no alternate screen, no widgets beyond the basics.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
serde_json = { workspace = true }
