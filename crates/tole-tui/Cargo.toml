[package]
name = "tole-tui"
description = "Inline terminal UI for tole (presentation + event loop over tole-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Crate kind of the CodeCora modular + thin-UI standard (#1250); checked by
# scripts/arch-check.sh. See "Crate kinds" in docs/architecture.md.
[package.metadata.tole]
kind = "ui"

[dependencies]
tole-core = { version = "0.12.0", path = "../tole-core", default-features = false }
# Inline viewport only: no alternate screen, no widgets beyond the basics.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# `bracketed-paste`: a pasted block arrives as one `Event::Paste` (#560).
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
serde_json = { workspace = true }
