# Cora Code Review Configuration
# See: https://github.com/codecoradev/cora-cli

# Provider settings — use global config (~/.cora/config.yaml)

# Review focus areas
focus:
  - security
  - performance
  - bugs

# Custom rules / additional instructions for the reviewer
rules:
  - "Fields and struct members named `api_key` (e.g. OpenAiConfig.api_key) are runtime-populated identifiers resolved from TOLE_API_KEY / OPENAI_API_KEY env vars. They are never hardcoded secrets. Do not flag 'hardcoded password or secret' on these declarations."
  - "Tool execution uses Command::new with explicit argv arrays (cora_search.rs, gh.rs, uteke.rs, subprocess.rs). Binary paths and arguments are validated (gh.rs validates number/base against strict regex; read_file/write_file enforce a path jail). This is a controlled subprocess invocation pattern, not command injection. Do not flag 'command injection' on these call sites."
  - "Since #596/#634 the durable session log stores the redacted form: storage.rs redacts every entry payload and the pinned system prompt with the process SecretSet before the line is written. A durable write (session log, ledger, usage record) that can carry a secret without going through that redaction is a real finding; flag it."
  - "Loop-guard fingerprinting (E10) hashes tool name + sorted-keys JSON input to detect repeated identical calls. The guard intentionally allows up to 3 identical consecutive calls before erroring; this is deliberate budget behavior, not a missing validation."

# Ignore patterns
ignore:
  files:
    - "*.lock"
    - "Cargo.lock"
    - "target/"
    # #705: generated or prose files. NOTE: in cora 0.20 `ignore.files` scopes
    # the symbol index and the context chain (what is injected as surrounding
    # code), not the diff the reviewer reads; a PR's own CHANGELOG/docs lines
    # still count toward its size until cora-code can exclude paths from a diff.
    - "CHANGELOG.md"
    - "docs/**"
  rules:
    - "Hardcoded password or secret"
    - "Command injection via exec/system with dynamic input"
    - "SQL injection via string concatenation"
    # Deterministic rule ids (cora 0.19). Each was validated against a full
    # `cora scan --no-llm` of the repo (457 findings) before being silenced:
    # - bug-todo matches the WORD "todo" (the todo_write/TodoState feature,
    #   `mod todo`), never a TODO marker: 22 of 22 hits were false positives.
    - "bug-todo"
    # - qual-clone: 306 info-level hits, almost all Arc/String clones that
    #   are the intended ownership model; no signal.
    - "qual-clone"
    # - bug-expect: every hit states a local invariant in its message
    #   (`expect("stdout piped above")`, poisoned-lock and runtime-build
    #   expects); the project's style, not unchecked external input.
    - "bug-expect"
    # - bug-println: the CLI's stdout IS its interface and eprintln! is the
    #   diagnostics channel. The real constraint (tole-core never writes to
    #   stdout) is enforced precisely by the core-no-stdout rule below.
    - "bug-println"

# Deterministic custom rules (no LLM; run by `cora review` and `cora scan`).
# `languages` takes file extensions, and `exclude` is required.
rules_engine:
  custom:
    - id: core-no-stdout
      # println!/print! but not eprintln!/eprint! (stderr diagnostics are fine).
      pattern: "(?:^|[^a-z_])(?:println|print)!\\("
      severity: major
      message: "tole-core must stay embedder-safe: no stdout (hosts own I/O through the traits)"
      languages: ["rs"]
      exclude: ["crates/tole-cli/**", "evals/**", "**/tests/**"]

# Hook settings
hook:
  mode: warn          # "warn" (print but allow) or "block" (fail commit)
  min_severity: major # minimum severity to trigger hook action
  max_diff_size: 5242880 # max 5MB diff chars before refusing

# Output settings
output:
  format: pretty      # pretty, json, compact, sarif
  color: true
