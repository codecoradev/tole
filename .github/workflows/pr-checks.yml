name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]

jobs:
  branch-naming:
    name: Branch Naming
    runs-on: ubuntu-latest
    # Bot PRs (Dependabot/Renovate) use their own branch names and bodies;
    # same exemption as codecoradev/uteke. Human PRs stay fully checked.
    if: "!contains(fromJSON('[\"dependabot[bot]\", \"renovate[bot]\", \"github-actions[bot]\", \"app/dependabot\", \"app/renovate\"]'), github.event.pull_request.user.login)"
    steps:
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Checking branch: $HEAD_REF"

          # Skip check for merge PRs from protected branches (develop → main)
          if echo "$HEAD_REF" | grep -qE "^(develop|main)$"; then
            echo "⏭️ Skipping branch naming check for protected branch: $HEAD_REF"
            exit 0
          fi

          # Allowed prefixes (kebab-case)
          ALLOWED="^(feat|fix|docs|chore|perf|security|refactor|test|build|ci)/"

          if echo "$HEAD_REF" | grep -qE "$ALLOWED"; then
            echo "✅ Branch name follows convention"
          else
            echo "::error::Branch name must start with one of: feat/, fix/, docs/, chore/, perf/, security/, refactor/, test/, build/, ci/"
            echo "Example: fix/rrf-normalization, feat/namespace-memory"
            echo "Current: $HEAD_REF"
            exit 1
          fi

  pr-template:
    name: PR Description
    runs-on: ubuntu-latest
    # Bot PRs (Dependabot/Renovate) use their own branch names and bodies;
    # same exemption as codecoradev/uteke. Human PRs stay fully checked.
    if: "!contains(fromJSON('[\"dependabot[bot]\", \"renovate[bot]\", \"github-actions[bot]\", \"app/dependabot\", \"app/renovate\"]'), github.event.pull_request.user.login)"
    steps:
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR description..."

          # Check for required sections
          MISSING=""

          if ! echo "$PR_BODY" | grep -qi "## What"; then
            MISSING="$MISSING\n  - ## What (description of the change)"
          fi

          if ! echo "$PR_BODY" | grep -qi "## Why"; then
            MISSING="$MISSING\n  - ## Why (the problem you're solving)"
          fi

          if ! echo "$PR_BODY" | grep -qi "## Testing"; then
            MISSING="$MISSING\n  - ## Testing (how you verified this works)"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::PR description is missing required sections:$MISSING"
            echo ""
            echo "Please fill out the PR template. Copy it from:"
            echo "https://github.com/codecoradev/tole/blob/develop/.github/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi

          echo "✅ PR description has required sections"

  commit-conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Do not echo $PR_TITLE directly — untrusted content in logs

          # Conventional Commits: type(scope): description
          # Types: feat, fix, docs, chore, perf, refactor, test, build, ci, security
          PATTERN="^(feat|fix|docs|chore|perf|refactor|test|build|ci|security)(\(.+\))?!?: .+"

          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title follows Conventional Commits"
          else
            echo "::error::PR title must follow Conventional Commits format"
            echo "Expected: type(scope): short description"
            echo "Example: fix(recall): handle empty query"
            echo "Types: feat, fix, docs, chore, perf, refactor, test, build, ci, security"
            echo "Current: $PR_TITLE"
            exit 1
          fi

  message-standard:
    name: Message Standard
    runs-on: ubuntu-latest
    # Bot PRs are exempt, as above.
    if: "!contains(fromJSON('[\"dependabot[bot]\", \"renovate[bot]\", \"github-actions[bot]\", \"app/dependabot\", \"app/renovate\"]'), github.event.pull_request.user.login)"
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check commit messages and the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          # The disallowed-line pattern lives in a repository variable
          # (team message standard), not in this file.
          PATTERN: ${{ vars.MESSAGE_STANDARD_PATTERN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fail loud when the standard is not configured: a skipped check
          # must never look like a passing one.
          if [ -z "$PATTERN" ]; then
            echo "::error::message-standard: MESSAGE_STANDARD_PATTERN is not configured"
            exit 1
          fi
          # Every commit on the branch: the squash commit can pick up
          # trailers from them even when it uses the PR description.
          MESSAGES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.[].commit.message')
          # grep: 0 = match, 1 = no match, >1 = error (an invalid pattern),
          # which must fail loudly, never read as "no match".
          matches() {
            rc=0
            printf '%s\n' "$1" | grep -qiE "$PATTERN" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::message-standard: MESSAGE_STANDARD_PATTERN is not a valid pattern"
              exit 1
            fi
            return "$rc"
          }
          FAILED=0
          if matches "$MESSAGES"; then
            echo "::error::message-standard: a commit message carries a trailer that is not allowed (see the team message standard). Reword those commits before merging."
            FAILED=1
          fi
          if matches "$PR_BODY"; then
            echo "::error::message-standard: the PR description carries a line that is not allowed (see the team message standard)."
            FAILED=1
          fi
          if [ "$FAILED" -eq 0 ]; then
            echo "✅ Commit messages and PR description follow the message standard"
          fi
          exit "$FAILED"
