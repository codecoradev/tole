name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # Issue #175: the embedder/mobile checks only cover tole-core's
  # --no-default-features profile, so the tole-cli no-mcp host profile
  # drifted uncompilable invisibly (feature-gated command paths
  # referencing gated-out items). Keep it compiling AND warning-free —
  # a drift here means a cfg gate is wrong somewhere. Issue #310: also
  # check tole-core's integration tests in --no-default-features (they
  # silently stopped compiling there once).
  no-mcp:
    name: no-mcp profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-mcp
      - run: |
          # #330: the bare profile (neither shell-tools nor mcp) must compile too.
          cargo check -p tole-cli --no-default-features
          cargo test -p tole-cli --no-default-features
          cargo check -p tole-cli --no-default-features --features shell-tools
          cargo clippy -p tole-cli --no-default-features --features shell-tools -- -D warnings
          cargo test -p tole-cli --no-default-features --features shell-tools
          cargo check -p tole-core --no-default-features --tests

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Compile the release profile — catches optimizer-only errors that the
  # dev-profile Check job misses (uteke parity; required check on main).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  # E9 embedder/mobile profile: tole-core must keep compiling for the
  # mobile targets with --no-default-features (no subprocess tools, no
  # MCP). Check-only — no link, no device. Android additionally needs
  # the NDK clang for bundled sqlite (the cc crate); ubuntu runners ship
  # the NDK, we just point the cc env vars at the newest one.
  cross-compile:
    name: Cross-Compile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS is off for now: the macos-14 runner is not available to
          # this repository ("configuration macos-14-arm64-us-default is not
          # supported"), so the job was cancelled on every run. Re-enable
          # when an Apple runner is available.
          # - os: macos-14
          #   target: aarch64-apple-ios
          - os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Point cc at the preinstalled Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_BIN="$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check -p tole-core --target ${{ matrix.target }} --no-default-features

  # v0.11.0 shipped a Windows build break (an ungated std::os::unix use)
  # that nothing on the PR path compiled. Mirror the release matrix's
  # native targets (windows-latest / macos-latest, default features,
  # same toolchain action) so a green PR check means a green release
  # build. Check-only (no link, no release profile) to keep runner cost
  # low; the test targets are compiled but not run.
  os-check:
    name: OS Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: os-check-${{ matrix.target }}
      - run: cargo check --workspace --all-targets --target ${{ matrix.target }}
      - run: cargo test -p tole-core --no-run --target ${{ matrix.target }}

  # Issue #749: the sandbox integration tests (#601) need a working
  # bubblewrap; without one they print `SKIPPED:` and pass, so the
  # hardening (no network, no data dir, no $HOME, read-only workspace,
  # CapEff 0, per-session binds, server lifecycle) was only exercised on
  # developer machines. This job installs bubblewrap and sets
  # TOLE_REQUIRE_BWRAP=1, which turns a skip into a failure. Only the three
  # sandbox test targets run (the full suite is the Test job).
  #
  # Ubuntu 24.04 runners ship AppArmor's
  # kernel.apparmor_restrict_unprivileged_userns=1, which denies bwrap the
  # user namespace it needs. The relaxation below is scoped to this job's
  # ephemeral VM (sysctl -w is not persistent and the runner is discarded);
  # it changes nothing outside the job. No secrets are used.
  sandbox-bwrap:
    name: Sandbox (bubblewrap)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TOLE_REQUIRE_BWRAP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sandbox-bwrap
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Allow unprivileged user namespaces (job-local)
        run: |
          for k in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
            echo "before: $k=$(sysctl -n "$k" 2>/dev/null || echo '<absent>')"
          done
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null)" = "0" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          for k in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone; do
            echo "after: $k=$(sysctl -n "$k" 2>/dev/null || echo '<absent>')"
          done
          bwrap --unshare-all --unshare-user --disable-userns --ro-bind / / true && echo "bwrap works"
      - name: Sandbox tests
        run: |
          set -o pipefail
          cargo test -p tole-core --features mcp \
            --test mcp_sandbox --test mcp_sandbox_lifecycle --test mcp_sandbox_idle \
            -- --nocapture --test-threads=1 2>&1 | tee sandbox.log
          # Belt and braces: TOLE_REQUIRE_BWRAP already fails a skip, and the
          # tests must really have run (not zero tests, no SKIPPED line).
          if grep -n "SKIPPED" sandbox.log; then echo "a sandbox test was skipped"; exit 1; fi
          [ "$(grep -c '^test result: ok\. [1-9]' sandbox.log)" -eq 3 ] || { echo "expected 3 test targets with passing tests"; exit 1; }
