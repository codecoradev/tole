name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish tole-core, tole-tui and tole-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Idempotent by explicit classification: an "already published"
      # rejection is a SUCCESS outcome (the crate is at this version on
      # crates.io); any other failure is a real error and fails the job.
      - name: Publish tole-core
        id: publish
        run: |
          set +e
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p tole-core 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "result=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qiE "already (exists|uploaded|published)|duplicate version" publish.log; then
            echo "::notice::tole-core is already at this version on crates.io — no-op"
            echo "result=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      # tole-tui ships as its own crate and tole-cli depends on it by
      # version, so the tui publish above MUST have succeeded (published
      # or already-published) before the CLI can resolve its dependency.
      - name: Publish tole-tui
        id: publish-tui
        run: |
          set +e
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p tole-tui 2>&1 | tee publish-tui.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "result=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qiE "already (exists|uploaded|published)|duplicate version" publish-tui.log; then
            echo "::notice::tole-tui is already at this version on crates.io — no-op"
            echo "result=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      # tole-cli depends on tole-core and tole-tui by version (pinned in
      # its manifest), so both publishes above MUST have succeeded
      # (published or already-published) before the CLI can resolve its
      # dependencies.
      - name: Publish tole-cli
        id: publish-cli
        run: |
          set +e
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p tole-cli 2>&1 | tee publish-cli.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "result=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qiE "already (exists|uploaded|published)|duplicate version" publish-cli.log; then
            echo "::notice::tole-cli is already at this version on crates.io — no-op"
            echo "result=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report
        run: 'echo "publish result: core=${{ steps.publish.outputs.result }} tui=${{ steps.publish-tui.outputs.result }} cli=${{ steps.publish-cli.outputs.result }}"'

