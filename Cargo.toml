[workspace]
resolver = "2"
members = ["crates/tole-core", "crates/tole-cli", "crates/tole-tui", "crates/tole-desktop-model", "crates/tole-desktop", "crates/tole-client"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codecoradev/tole"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive"] }

# D4 (#1252): `unsafe` is denied in every crate. A module that has to call into
# libc opts in with one `#[allow(unsafe_code)]` and a `// SAFETY:` comment;
# AGENTS.md lists the opt-in files and `scripts/arch-check.sh unsafe` keeps that
# list equal to the code.
[workspace.lints.rust]
unsafe_code = "deny"

# Release profile. Size, measured and attributed in docs/perf/binary-size.md
# (#991): 24.6 MB (23.5 MiB) stripped at 9dc6caf (x86_64 Linux, default
# features, `cargo build --release -p tole-cli`), 35.5 MB unstripped. The growth since
# v0.10.1 (11.4 MB) is the HTTP MCP client, the web tools, the secret detector's
# regex stack and first-party code, not one regression. bench/budget.toml gates
# the size (`binary_size_mib`). Tried and not adopted, with the runtime cost
# measured: opt-level = "s" (-22.7% size; open of a 20k-entry session about +25%
# slower, redaction of 4 KiB texts 25 to 55% slower), lto = "fat" (-9.0%, runtime
# neutral, 2 to 3x the release build time). `--no-default-features`: 10.3 MB.
# panic = "abort" is deliberately NOT set: tole relies on unwinding (Mutex
# poison recovery via `lock().unwrap_or_else(|p| p.into_inner())`, turns run on
# threads / spawn_blocking), and abort would kill every session of a
# serve/ACP/MCP daemon on a single tool-thread panic.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
