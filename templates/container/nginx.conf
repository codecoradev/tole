# nginx instead of Caddy (issue #1044, docs/container.md). A server block for
# http {}; the certificate is yours (for example certbot). The streaming rules
# are the same as in the Caddyfile: no response buffering, no compression, no
# read timeout shorter than a turn.

# Slows a guesser down at the proxy. tole's own limiter sees only this proxy's
# address (it does not read X-Forwarded-For), so this is the only per-client
# limit there is.
limit_req_zone $binary_remote_addr zone=tole_req:10m rate=20r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name tole.example.com;

    ssl_certificate     /etc/letsencrypt/live/tole.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tole.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Image upload cap of tole is 10 MiB.
    client_max_body_size 12m;
    # An upload from a phone link must not be cut early.
    client_body_timeout 120s;

    location / {
        limit_req zone=tole_req burst=40 nodelay;

        proxy_pass http://127.0.0.1:7801;   # or http://tole:7801 inside compose
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Event stream: forward every write at once.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # tole also sends `X-Accel-Buffering: no`, which nginx honors; keep
        # proxy_buffering off here anyway (the header can be ignored by a
        # setting such as proxy_ignore_headers).

        # Must exceed the heartbeat (15 s) and a whole turn: POST .../prompt
        # answers when the turn ends. 1 h is above the provider timeout cap.
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
    }
}
